# Reference vhost. The live copy is /etc/nginx/sites-enabled/default on the prod host.
# teachforthprojects.samsprojects.xyz is a different origin from the IDE and from the power panel.

server {
    listen 443 ssl;
    server_name teachforthprojects.samsprojects.xyz;

    ssl_certificate     /etc/letsencrypt/live/samsprojects.xyz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/samsprojects.xyz/privkey.pem;

    root /var/www/teachforth-projects;
    index index.html;
    autoindex off;

    location / {
        try_files $uri $uri/index.html =404;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer always;
    }
}
